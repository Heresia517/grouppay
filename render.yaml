services:
  - type: web
    name: zionpay-web
    env: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "zionpay.app,www.zionpay.app,zionpay-web.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: zionpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zionpay-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: zionpay-redis
          type: redis
          property: connectionString
      - key: SYNC_SERVER_URL
        value: "https://zionpay-web.onrender.com/api/sync"

  - type: worker
    name: zionpay-celery-worker
    env: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: SECRET_KEY
        fromService:
          name: zionpay-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: zionpay-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: zionpay-redis
          type: redis
          property: connectionString

  - type: worker
    name: zionpay-celery-beat
    env: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: SECRET_KEY
        fromService:
          name: zionpay-web
          type: web
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          name: zionpay-redis
          type: redis
          property: connectionString

  - type: redis
    name: zionpay-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: zionpay-db
    plan: starter
    region: frankfurt
    databaseName: zionpay
    user: zionpay
