{% extends "base.html" %}
{% block title %}Page introuvable — {{ organization.name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-20">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-slate-100 mb-6">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-slate-900 mb-2">404</h1>
    <h2 class="text-2xl font-bold text-slate-900 mb-3">Page introuvable</h2>
    <p class="text-slate-500 mb-8">La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <div class="flex justify-center gap-3">
        <a href="/" class="px-6 py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 shadow-sm">
            Retour à l'accueil
        </a>
        <button onclick="history.back()" class="px-6 py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200">
            Page précédente
        </button>
    </div>
</div>
{% endblock %}
