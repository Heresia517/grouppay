{% extends "base.html" %}
{% block title %}Erreur serveur — {{ organization.name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-20">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-red-100 mb-6">
        <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-slate-900 mb-2">500</h1>
    <h2 class="text-2xl font-bold text-slate-900 mb-3">Erreur serveur</h2>
    <p class="text-slate-500 mb-8">Une erreur inattendue est survenue. Nos équipes ont été notifiées.</p>
    <div class="flex justify-center gap-3">
        <a href="/" class="px-6 py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 shadow-sm">
            Retour à l'accueil
        </a>
        <button onclick="location.reload()" class="px-6 py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200">
            Réessayer
        </button>
    </div>
</div>
{% endblock %}
