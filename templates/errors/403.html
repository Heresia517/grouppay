{% extends "base.html" %}
{% block title %}Accès refusé — {{ organization.name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-20">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-amber-100 mb-6">
        <svg class="w-12 h-12 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-slate-900 mb-2">403</h1>
    <h2 class="text-2xl font-bold text-slate-900 mb-3">Accès refusé</h2>
    <p class="text-slate-500 mb-8">Vous n'avez pas les permissions nécessaires pour accéder à cette page.</p>
    <div class="flex justify-center gap-3">
        <a href="/" class="px-6 py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 shadow-sm">
            Retour à l'accueil
        </a>
    </div>
</div>
{% endblock %}
