{% extends "base.html" %}
{% block title %}Requête invalide — {{ organization.name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-20">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-amber-100 mb-6">
        <svg class="w-12 h-12 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-slate-900 mb-2">400</h1>
    <h2 class="text-2xl font-bold text-slate-900 mb-3">Requête invalide</h2>
    <p class="text-slate-500 mb-8">La requête n'a pas pu être traitée. Vérifiez vos données et réessayez.</p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 shadow-sm">
        Retour à l'accueil
    </a>
</div>
{% endblock %}
