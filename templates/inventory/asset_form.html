{% extends "base.html" %}
{% block title %}{% if asset %}Modifier{% else %}Nouvel{% endif %} actif{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">

    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'asset_list' %}" class="text-sm text-slate-600 hover:text-brand-600">← Actifs</a>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">
        {% if asset %}Modifier {{ asset.reference }}{% else %}Nouvel actif{% endif %}
    </h1>

    <form method="post" class="bg-white rounded-2xl shadow-card border border-slate-100 p-6 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom de l'actif *</label>
                <input type="text" name="name" required value="{{ asset.name|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Categorie *</label>
                <select name="category" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    <option value="">Choisir...</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if asset.category_id == c.id %}selected{% endif %}>{{ c.code }} — {{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Marque</label>
                <input type="text" name="brand" value="{{ asset.brand|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Modele</label>
                <input type="text" name="model_name" value="{{ asset.model_name|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">N° serie</label>
                <input type="text" name="serial_number" value="{{ asset.serial_number|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Description</label>
            <textarea name="description" rows="2" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm resize-none">{{ asset.description|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Localisation</label>
                <input type="text" name="location" value="{{ asset.location|default:'' }}" placeholder="Batiment, bureau..."
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Fournisseur</label>
                <input type="text" name="supplier" value="{{ asset.supplier|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Statut</label>
                <select name="status" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    {% for val, label in statuses %}
                    <option value="{{ val }}" {% if asset.status == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Etat</label>
                <select name="condition" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    {% for val, label in conditions %}
                    <option value="{{ val }}" {% if asset.condition == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Taux amortissement (%)</label>
                <input type="number" name="depreciation_rate" step="0.01" value="{{ asset.depreciation_rate|default:20 }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Prix achat</label>
                <input type="number" name="purchase_price" step="0.01" value="{{ asset.purchase_price|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Date d'achat</label>
                <input type="date" name="purchase_date" value="{{ asset.purchase_date|date:'Y-m-d'|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Fin garantie</label>
                <input type="date" name="warranty_end_date" value="{{ asset.warranty_end_date|date:'Y-m-d'|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Notes</label>
            <textarea name="notes" rows="2" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm resize-none">{{ asset.notes|default:'' }}</textarea>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <a href="{% url 'asset_list' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Annuler</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 shadow-sm">
                {% if asset %}Enregistrer{% else %}Creer{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
