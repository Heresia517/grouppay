<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="font-family:Inter,system-ui,sans-serif;background:#f8fafc;margin:0;padding:32px 16px">
<table width="100%"><tr><td align="center">
<table width="560" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)">
<tr><td style="background:linear-gradient(135deg,{{ color_primary|default:"#2563eb" }},{{ color_secondary|default:"#1e40af" }});padding:32px;color:#fff">
<h1 style="margin:0;font-size:24px;font-weight:800">{{ organization.name }}</h1>
<p style="margin:8px 0 0;opacity:.9;font-size:14px">ZionPay — Demandes d'Achat</p>
</td></tr>
<tr><td style="padding:32px">
<h2 style="margin:0 0 16px;font-size:20px;color:#0f172a">{{ title }}</h2>
<p style="margin:0 0 24px;color:#475569;font-size:14px;line-height:1.6">{{ body }}</p>
{% if action_url %}
<a href="{{ action_url }}" style="display:inline-block;background:#2563eb;color:#fff;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px">Voir la demande →</a>
{% endif %}
</td></tr>
<tr><td style="padding:24px;background:#f8fafc;text-align:center;font-size:12px;color:#94a3b8">
© {% now "Y" %} ZionPay — Notification automatique
</td></tr>
</table>
</td></tr></table>
</body></html>
