{% extends "base.html" %}
{% block title %}Nouvelle DA — {{ organization.name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">

    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'da_dashboard' %}" class="text-sm text-slate-600 hover:text-brand-600">← Retour</a>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Nouvelle Demande d'Achat</h1>
    <p class="text-slate-500 text-sm mb-8">Remplissez le formulaire pour creer une DA en brouillon</p>

    <form method="post" class="bg-white rounded-2xl shadow-card border border-slate-100 p-6 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Service demandeur *</label>
                <select name="service" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    <option value="">Choisir...</option>
                    {% for s in services %}
                    <option value="{{ s.id }}" {% if user.service_id == s.id %}selected{% endif %}>
                        {{ s.direction.code }} / {{ s.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Priorite</label>
                <select name="priority" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    <option value="NORMALE">Normale</option>
                    <option value="HAUTE">Haute</option>
                    <option value="URGENTE">Urgente</option>
                    <option value="BASSE">Basse</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Motif / Justification *</label>
            <textarea name="purpose" required rows="3" placeholder="Decrivez le besoin..."
                      class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm resize-none"></textarea>
        </div>

        <!-- Articles -->
        <div>
            <h3 class="font-bold text-slate-900 mb-3">Articles demandes</h3>
            <div id="items-container" class="space-y-3">
                <div class="item-row grid grid-cols-12 gap-2">
                    <div class="col-span-7">
                        <select name="item_id[]" class="block w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                            <option value="">Choisir un article...</option>
                            {% for item in items %}
                            <option value="{{ item.id }}">
                                {{ item.category.name }} / {{ item.name }} ({{ item.unit }}) — Stock: {{ item.stock_quantity }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-span-3">
                        <input type="number" name="quantity[]" min="1" placeholder="Qte" class="block w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    </div>
                    <div class="col-span-2 flex items-center">
                        <button type="button" onclick="this.closest('.item-row').remove()" class="text-red-600 text-sm font-semibold">Suppr</button>
                    </div>
                </div>
            </div>
            <button type="button" onclick="addItem()" class="mt-3 px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200">
                + Ajouter un article
            </button>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <a href="{% url 'da_dashboard' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Annuler</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700">Creer la DA</button>
        </div>
    </form>
</div>

<script>
function addItem() {
    const container = document.getElementById('items-container');
    const firstRow = container.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);
    newRow.querySelectorAll('input').forEach(i => i.value = '');
    newRow.querySelectorAll('select').forEach(s => s.value = '');
    container.appendChild(newRow);
}
</script>
{% endblock %}
