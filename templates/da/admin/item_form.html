{% extends "base.html" %}
{% block title %}{% if item %}Modifier{% else %}Nouvel{% endif %} article{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">

    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'da_admin_items' %}" class="text-sm text-slate-600 hover:text-brand-600">← Articles</a>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">
        {% if item %}Modifier « {{ item.name }} »{% else %}Nouvel article{% endif %}
    </h1>

    <form method="post" class="bg-white rounded-2xl shadow-card border border-slate-100 p-6 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Reference</label>
                <input type="text" name="reference" maxlength="50" value="{{ item.reference|default:'' }}"
                       placeholder="PAP-A4-500" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-mono">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Unite *</label>
                <select name="unit" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                    <option value="PCS" {% if item.unit == 'PCS' %}selected{% endif %}>Piece(s)</option>
                    <option value="BOX" {% if item.unit == 'BOX' %}selected{% endif %}>Boite(s)</option>
                    <option value="REAM" {% if item.unit == 'REAM' %}selected{% endif %}>Rame(s)</option>
                    <option value="PACK" {% if item.unit == 'PACK' %}selected{% endif %}>Paquet(s)</option>
                    <option value="KG" {% if item.unit == 'KG' %}selected{% endif %}>Kilogramme(s)</option>
                    <option value="L" {% if item.unit == 'L' %}selected{% endif %}>Litre(s)</option>
                    <option value="M" {% if item.unit == 'M' %}selected{% endif %}>Metre(s)</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom de l'article *</label>
            <input type="text" name="name" required maxlength="200" value="{{ item.name|default:'' }}"
                   class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Categorie *</label>
            <select name="category" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                <option value="">Choisir...</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {% if item.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Description</label>
            <textarea name="description" rows="3" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm resize-none">{{ item.description|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Prix unitaire ({{ organization.currency_code }})</label>
                <input type="number" name="unit_price" step="0.01" min="0" value="{{ item.unit_price|default:0 }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Stock initial</label>
                <input type="number" name="stock_quantity" min="0" value="{{ item.stock_quantity|default:0 }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Seuil d'alerte</label>
                <input type="number" name="reorder_level" min="0" value="{{ item.reorder_level|default:5 }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Quantite max par DA (optionnel)</label>
            <input type="number" name="max_per_request" min="1" value="{{ item.max_per_request|default:'' }}"
                   placeholder="Laisser vide = illimite"
                   class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
        </div>

        <div class="space-y-3 pt-4 border-t border-slate-100">
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="is_active" {% if item.is_active or not item %}checked{% endif %}
                       class="w-4 h-4 rounded border-slate-300 text-brand-600">
                <span class="text-sm font-medium text-slate-700">Article actif (visible dans le catalogue)</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="is_available_to_all" {% if item.is_available_to_all or not item %}checked{% endif %}
                       class="w-4 h-4 rounded border-slate-300 text-brand-600">
                <span class="text-sm font-medium text-slate-700">Disponible pour tous les demandeurs</span>
            </label>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <a href="{% url 'da_admin_items' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Annuler</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 shadow-sm">
                {% if item %}Enregistrer{% else %}Creer{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
