{% extends "base.html" %}
{% block title %}{% if service %}Modifier{% else %}Nouveau{% endif %} service{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">

    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'da_admin_services' %}" class="text-sm text-slate-600 hover:text-brand-600">← Services</a>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">
        {% if service %}Modifier le service{% else %}Nouveau service{% endif %}
    </h1>

    <form method="post" class="bg-white rounded-2xl shadow-card border border-slate-100 p-6 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Code *</label>
                <input type="text" name="code" required maxlength="20" value="{{ service.code|default:'' }}"
                       placeholder="MAINT" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-mono uppercase">
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom *</label>
                <input type="text" name="name" required maxlength="150" value="{{ service.name|default:'' }}"
                       class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Direction *</label>
            <select name="direction" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                <option value="">Choisir...</option>
                {% for d in directions %}
                <option value="{{ d.id }}" {% if service.direction_id == d.id %}selected{% endif %}>{{ d.code }} — {{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Chef de service</label>
            <select name="chief" class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
                <option value="">Aucun</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if service.chief_id == u.id %}selected{% endif %}>
                    {{ u.email }} {% if u.is_service_chief %}(Chef){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Ordre</label>
            <input type="number" name="display_order" min="0" value="{{ service.display_order|default:0 }}"
                   class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm">
        </div>

        <label class="flex items-center gap-3 cursor-pointer pt-4 border-t border-slate-100">
            <input type="checkbox" name="is_active" {% if service.is_active or not service %}checked{% endif %}
                   class="w-4 h-4 rounded border-slate-300 text-brand-600">
            <span class="text-sm font-medium text-slate-700">Service actif</span>
        </label>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <a href="{% url 'da_admin_services' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Annuler</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 shadow-sm">
                {% if service %}Enregistrer{% else %}Creer{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
