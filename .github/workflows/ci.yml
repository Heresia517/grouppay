name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zionpay_test
          POSTGRES_USER: zionpay
          POSTGRES_PASSWORD: zionpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django ruff

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Django check
        env:
          SECRET_KEY: test-key
          DATABASE_URL: postgres://zionpay:zionpay@localhost:5432/zionpay_test
        run: python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: test-key
          DATABASE_URL: postgres://zionpay:zionpay@localhost:5432/zionpay_test
        run: pytest tests/ -v --tb=short

      - name: Audit score
        env:
          SECRET_KEY: test-key
        run: python audit_zionpay.py || true

      - name: ZionPay PRD compliance audit
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python audit_zionpay_v2.py | tee audit_output.txt
          if ! grep -q "SCORE GLOBAL : 100.0%" audit_output.txt; then
            echo "❌ Régression de conformité PRD détectée"
            grep "XX" audit_output.txt || true
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            INVENTAIRE.md
            audit_inventaire.json
            audit_output.txt
