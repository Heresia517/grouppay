name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grouppay_test
          POSTGRES_USER: grouppay
          POSTGRES_PASSWORD: grouppay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django ruff

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Django check
        env:
          SECRET_KEY: test-key
          DATABASE_URL: postgres://grouppay:grouppay@localhost:5432/grouppay_test
        run: python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: test-key
          DATABASE_URL: postgres://grouppay:grouppay@localhost:5432/grouppay_test
        run: pytest tests/ -v --tb=short

      - name: Audit score
        env:
          SECRET_KEY: test-key
        run: python audit_grouppay.py || true
